[package]
name = "stellar-mev-transaction"
version = "0.1.0"
edition = "2021"

[dependencies]
stellar-mev-core = { path = "../core" }
stellar-mev-state = { path = "../state" }
stellar-mev-opportunity = { path = "../opportunity" }
stellar-mev-simulation = { path = "../simulation" }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
