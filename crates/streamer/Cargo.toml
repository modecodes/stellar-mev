[package]
name = "stellar-mev-streamer"
version = "0.1.0"
edition = "2021"

[dependencies]
stellar-mev-core = { path = "../core" }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
thiserror = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
