[workspace]
members = [
    "crates/core",
    "crates/streamer",
    "crates/state",
    "crates/opportunity",
    "crates/simulation",
    "crates/transaction",
    "crates/dashboard",
    "."
]
resolver = "2"

[package]
name = "stellar-mev"
version = "0.1.0"
edition = "2021"

[dependencies]
stellar-mev-core = { path = "crates/core" }
stellar-mev-streamer = { path = "crates/streamer" }
stellar-mev-state = { path = "crates/state" }
stellar-mev-opportunity = { path = "crates/opportunity" }
stellar-mev-simulation = { path = "crates/simulation" }
stellar-mev-transaction = { path = "crates/transaction" }
stellar-mev-dashboard = { path = "crates/dashboard" }

tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
colored = "2.1"
ratatui = "0.28"
crossterm = "0.28"
