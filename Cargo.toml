[workspace]
members = [
    "crates/core",
    "crates/streamer",
    "crates/state",
    "crates/opportunity",
    "crates/simulation",
]
resolver = "2"

[package]
name = "stellar-mev"
version = "0.1.0"
edition = "2021"

[dependencies]
stellar-mev-core = { path = "crates/core" }
stellar-mev-streamer = { path = "crates/streamer" }
stellar-mev-state = { path = "crates/state" }
stellar-mev-opportunity = { path = "crates/opportunity" }
stellar-mev-simulation = { path = "crates/simulation" }
